$kind: http-request
id: 09fa08f1-5441-4b0d-a8a7-6c3bdeb12003
name: GET /users/me
url: https://api.practicesoftwaretesting.com/users/me
method: GET
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/GET -users-me.resources/examples
order: 254
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          // "Response has user fields only when status code is 200"
          pm.test("Response has user fields only when status code is 200", function () {
              const json = pm.response.json();
              pm.expect(json).to.have.property("id");
              pm.expect(json).to.have.property("email");
              pm.expect(json.email).to.be.a("string").and.include("@");

              // save email
              pm.environment.set("email", json.email);
              // save password
              const passwordByEmail = {
              "admin@practicesoftwaretesting.com": "welcome01",
              "customer@practicesoftwaretesting.com": "welcome01",
              "customer2@practicesoftwaretesting.com": "welcome01",
              "customer3@practicesoftwaretesting.com": "pass123"
              };
              if (passwordByEmail[json.email]) {
              pm.environment.set("password", passwordByEmail[json.email]);
              }
          });
      }
    language: text/javascript
