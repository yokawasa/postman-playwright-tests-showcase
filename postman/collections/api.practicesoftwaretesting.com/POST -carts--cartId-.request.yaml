$kind: http-request
id: 1638175b-a631-4b89-9fe0-34bd90ceb2c5
name: POST /carts/{{cartId}}
url: https://api.practicesoftwaretesting.com/carts/{{cartId}}
method: POST
body:
  type: json
  content: |-
    {
      "product_id": "{{productId}}",
      "quantity": 1
    }
examples: ./.resources/POST -carts--cartId-.resources/examples
order: 11000
scripts:
  - type: afterResponse
    code: |-
      // "Status code is 200"
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      // "Response confirms item was added or updated"
      pm.test("Response confirms item was added or updated", function () {
        const json = pm.response.json();
        pm.expect(json).to.be.an("object");
        pm.expect(json).to.have.property("result");
        pm.expect(json.result).to.equal("item added or updated");
      });
